daemonize: true
pcap_interface: eth0
pcap_direction: in
pcap_filter: dst port 21 or dst port 23 or dst port 25 or dst port 445 or dst port 1433 or dst port 2323 or dst port 2375 or dst port 3306 or dst port 3389 or dst port 5060 or dst port 5432 or dst port 5900 or dst port 6379 or dst port 8080 or dst port 8443 or dst port 9200 or dst port 27017

aggregate: src_host, dst_port, proto
plugins: print[ports]

print_output[ports]: json
print_output_file[ports]: /var/lib/pmacct/ports.json
print_output_file_append[ports]: false
print_refresh_time[ports]: 60
print_history[ports]: 1m
print_history_roundoff[ports]: m
print_trigger_exec[ports]: /usr/local/bin/netopsec.py